[package]
name = "recordly-portal-cursor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", features = ["screencast"] }
clap = { version = "4.6.7", features = ["derive"] }
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
pipewire = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.190"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
