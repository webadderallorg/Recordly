name: Microsoft Store package

on:
  workflow_dispatch:
    inputs:
      store_version:
        description: Store version (major.minor.patch; increase for each submission)
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Build unsigned Store AppX (x64)
    runs-on: windows-latest
    env:
      RECORDLY_STORE_IDENTITY_NAME: ${{ vars.RECORDLY_STORE_IDENTITY_NAME }}
      RECORDLY_STORE_PUBLISHER: ${{ vars.RECORDLY_STORE_PUBLISHER }}
      RECORDLY_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.RECORDLY_STORE_PUBLISHER_DISPLAY_NAME }}
      RECORDLY_STORE_VERSION: ${{ inputs.store_version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_CLOUD_SHARE_ENDPOINT: ${{ vars.VITE_CLOUD_SHARE_ENDPOINT }}
      VITE_OAUTH_FLOW_ID_REDIRECTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate reserved Store identity
        run: node -e "require('./electron-builder.store.cjs')()"
      - name: Set up Windows FFmpeg compiler
        uses: msys2/setup-msys2@v2
        id: ffmpeg-msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            perl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build FFmpeg and FFprobe from pinned source
        env:
          RECORDLY_MSYS2_ROOT: ${{ steps.ffmpeg-msys2.outputs.msys2-location }}
        run: npm run build:ffmpeg-source
      - name: Remove stale uiohook build output
        shell: pwsh
        run: |
          if (Test-Path node_modules/uiohook-napi/build) {
            Remove-Item node_modules/uiohook-napi/build -Recurse -Force
          }
      - name: Install app dependencies
        run: npx electron-builder install-app-deps
      - name: Validate production cloud configuration
        run: npm run release:check-cloud
      - name: Test Store integration
        run: npm test -- electron/windowsStorePackage.test.mjs electron/updater.test.ts electron/appPaths.test.ts
      - name: Build Store package
        run: npm run build:win:store
      - name: Smoke test packaged binaries
        run: npm run smoke:packaged-binaries
      - name: Archive corresponding FFmpeg source
        run: tar -a -cf release/store/Recordly-windows-x64-ffmpeg-source.zip -C node_modules/ffmpeg-static/ffmpeg.exe.sources .
      - name: Upload package for manual certification testing and submission
        uses: actions/upload-artifact@v4
        with:
          name: recordly-microsoft-store-x64
          path: |
            release/store/*.appx
            release/store/*-ffmpeg-source.zip
          if-no-files-found: error

# This workflow only builds an artifact. It never submits or publishes to Store.
